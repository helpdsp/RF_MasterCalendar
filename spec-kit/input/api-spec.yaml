openapi: 3.1.0
info:
  title: Invoices for Tax Team — SharePoint REST API Reference
  version: 1.0.0
  description: >
    SharePoint Online REST API endpoints relevant to the Invoices for Tax Team
    site at Ruiz Foods. These are read-only reference endpoints for IT Administrators
    to verify configuration, item counts, and schema. All endpoints require
    authenticated access (Bearer token or cookie auth from the SharePoint site session).

servers:
  - url: https://ruizfoods.sharepoint.com/sites/InvoiceforTaxTeam
    description: SharePoint site root

paths:
  /_api/web/lists/getbytitle('Accounts Payable'):
    get:
      summary: Get Accounts Payable library properties
      description: Returns library settings including ItemCount, EnableVersioning, EnableModeration, BaseTemplate.
      responses:
        '200':
          description: Library properties
          content:
            application/json:
              example:
                Title: "Accounts Payable"
                ItemCount: 173704
                BaseTemplate: 101
                EnableVersioning: true
                EnableModeration: false
                ContentTypesEnabled: true

  /_api/web/lists/getbytitle('Fixed Assets'):
    get:
      summary: Get Fixed Assets library properties
      responses:
        '200':
          description: Library properties
          content:
            application/json:
              example:
                Title: "Fixed Assets"
                ItemCount: 11985
                BaseTemplate: 101

  /_api/web/lists/getbytitle('FY2023'):
    get:
      summary: Get FY2023 archive library properties
      responses:
        '200':
          description: Library properties
          content:
            application/json:
              example:
                Title: "FY2023"
                ItemCount: 16

  /_api/web/lists/getbytitle('FY2024'):
    get:
      summary: Get FY2024 archive library properties
      responses:
        '200':
          description: Library properties
          content:
            application/json:
              example:
                Title: "FY2024"
                ItemCount: 45933

  /_api/web/lists/getbytitle('Accounts Payable')/fields:
    get:
      summary: Get all fields for Accounts Payable library
      description: Returns all site and list columns including custom columns (Fiscal Year, Received Date, From, To, Subject).
      responses:
        '200':
          description: Field collection

  /_api/web/lists/getbytitle('Accounts Payable')/views:
    get:
      summary: Get all views for Accounts Payable library
      description: Returns all views including All Documents, Bulk Edit View, and hidden system views.
      responses:
        '200':
          description: View collection

  /_api/web/contenttypes:
    get:
      summary: Get all site content types
      description: Returns site-level content types including the custom Invoice for Tax Team group (Invoice Document, Accounts Payable, Fixed Asset).
      responses:
        '200':
          description: Content type collection

  /_api/web/contenttypes/GetById('0x010100E3917FC38B21344BB4F75ADAC1414E19'):
    get:
      summary: Get Invoice Document base content type
      responses:
        '200':
          description: Invoice Document content type details

  /_api/web/contenttypes/GetById('0x010100E3917FC38B21344BB4F75ADAC1414E1901'):
    get:
      summary: Get Accounts Payable content type
      responses:
        '200':
          description: Accounts Payable content type details

  /_api/web/contenttypes/GetById('0x010100E3917FC38B21344BB4F75ADAC1414E1902'):
    get:
      summary: Get Fixed Asset content type
      responses:
        '200':
          description: Fixed Asset content type details

  /_api/web/fields/GetByInternalNameOrTitle('Fiscal_x0020_Year'):
    get:
      summary: Get Fiscal Year site column
      responses:
        '200':
          description: Fiscal Year column definition

  /_api/web/fields/GetByInternalNameOrTitle('Received_x0020_Date'):
    get:
      summary: Get Received Date site column
      responses:
        '200':
          description: Received Date column definition

  /_api/web/roleassignments:
    get:
      summary: Get site permission assignments
      description: Returns all role assignments for the site. Use to verify Tax Team Members = Read, Owners = Full Control.
      responses:
        '200':
          description: Role assignment collection

  /_api/web/siteusers:
    get:
      summary: Get all site users
      description: Useful for verifying Tax Team Members group membership.
      responses:
        '200':
          description: Site user collection
